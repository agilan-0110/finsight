services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: finsight-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: finsight
    ports:
      - "5432:5432"
    volumes:
      - finsight_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finsight"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend + Groq + ChromaDB Memory Engine
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: finsight-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/finsight
      GROQ_API_KEY: ${GROQ_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-finsight_default_secret_key_change_in_prod}
    ports:
      - "8000:8000"
    volumes:
      - ./data_store:/app/data_store
    depends_on:
      db:
        condition: service_healthy

  # 3. React 19 Frontend + Nginx Reverse Proxy
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: finsight-frontend
    restart: always
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - backend

volumes:
  finsight_pgdata:
    driver: local
